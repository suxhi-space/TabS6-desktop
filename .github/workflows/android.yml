name: Build S6 Migrate app

on:
  push:
    paths:
      - 'android/**'
      - 'tools/migrate/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write   # to publish the APK as the "s6migrate-latest" pre-release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shared root scripts are in sync with the Termux tool
        run: tools/migrate/check-sync.sh

      - name: Shell syntax
        run: |
          bash -n tools/migrate/s6-migrate.sh
          sh -n tools/migrate/lib/scan.sh
          sh -n tools/migrate/lib/pack.sh
          sh -n tools/migrate/lib/compare.sh
          bash -n tools/migrate/s6-restore.sh
          bash -n tools/migrate/s6-doctor.sh
          bash -n tools/migrate/s6-android.sh
          sh -n tools/migrate/switch/update-binary
          # TWRP's shell (mksh) can't redirect to two-digit file descriptors: write via /proc/self/fd/$OUTFD
          ! grep -n '>&"\?\$OUTFD' tools/migrate/switch/update-binary
          bash -n tools/migrate/switch/s6-firstrun
          bash -n tools/migrate/fedora/s6-helper
          bash -n tools/migrate/fedora/s6-update
          bash -n tools/migrate/fedora/s6-look
          bash -n tools/migrate/fedora/system/s6-setup-session
          python3 -m py_compile tools/migrate/fedora/app/s6ui.py tools/migrate/fedora/app/setup.py tools/migrate/fedora/app/companion.py

      - name: Switch script with Fedora files embedded (every file on the install list exists)
        run: |
          python3 tools/migrate/switch/build-payload.py rehearsal /tmp/ub-rehearsal
          python3 tools/migrate/switch/build-payload.py switch /tmp/ub-switch
          sh -n /tmp/ub-rehearsal && sh -n /tmp/ub-switch
          sh -n tools/migrate/fix/update-binary && python3 tools/migrate/fix/build-zip.py /tmp/S6Migrate-FIX.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: |
          VER=$(sed -n "s/.*versionName '\(.*\)'.*/\1/p" android/app/build.gradle)
          cp android/app/build/outputs/apk/release/app-release.apk "S6Migrate-v$VER.apk"
          echo "APK=S6Migrate-v$VER.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: S6Migrate-apk
          path: ${{ env.APK }}

      - name: Publish as the s6migrate-latest pre-release (tap to download on the tablet)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete s6migrate-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create s6migrate-latest "$APK" --prerelease --target "$GITHUB_SHA" \
            --title "S6 Migrate (latest build)" \
            --notes "Built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}. Install on the tablet; allow installs from your browser when asked."
